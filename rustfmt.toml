# Configuração do rustfmt do openMTR (apenas opções ESTÁVEIS).
#
# A toolchain é estável (1.99), então opções `unstable` (ex.: `imports_granularity`,
# `group_imports`, `wrap_comments`) não são usadas. Agrupar imports é manual.

edition = "2024"
style_edition = "2024"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
hex_literal_case = "Lower"
use_field_init_shorthand = true
use_try_shorthand = true
