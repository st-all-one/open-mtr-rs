# Configuração do Cargo do openMTR (Rust 1.100+ / Edition 2024).
#
# Cooldown de publicação (Rust 1.100+, chave estável `[registry]
# global-min-publish-age`): o resolver ignora versões publicadas há menos de N,
# o que dá tempo para a comunidade detectar versões maliciosas/quebradas antes
# de o `Cargo.lock` pegá-las.
#
# Garantias:
# - Só afeta versões NOVAS: o que já está no `Cargo.lock` é mantido; com
#   `--locked` (CI, release, `install.sh`) o lock é usado como está, então o
#   cooldown nunca quebra um build.
# - Override pontual para adotar uma correção de segurança nova:
#     CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>
#   (a versão fica gravada no lock e passa a valer sem o override).
# - `cargo install` ignora o cooldown; pine `crate@versão` quando precisar.
[registry]
global-min-publish-age = "3 days"
