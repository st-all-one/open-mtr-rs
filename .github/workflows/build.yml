name: CI

# Push em qualquer branch + PRs. Release/bindings artefacts ficam fora deste fluxo.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt + clippy + test + file-length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - run: make doc

  cross-platform:
    name: test core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
      # Testes live se auto-ignoram sem credenciais; wiremock/unitários rodam sempre.
      - run: cargo test -p open-mtr-core

  supply-chain:
    name: deny + machete + typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny cargo-machete --locked
      - run: cargo deny check
      - run: cargo machete
      - uses: crate-ci/typos@master
