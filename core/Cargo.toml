[package]
name = "open-mtr-core"
edition.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["native-http"]
native-http = ["dep:reqwest", "dep:tokio", "reqwest/rustls-tls"]
wasm-http = ["dep:gloo-net", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
async-trait.workspace = true
url.workspace = true
futures.workspace = true

reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
gloo-net = { version = "0.6", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Headers", "Request", "RequestInit", "RequestMode",
    "Response", "Window",
] }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = false }
wasm-bindgen-futures = { version = "0.4", optional = false }
web-time = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "wasmbind", "std"] }
uuid = { version = "1", features = ["std", "v7", "serde", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock = "0.6"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "download_validation"
harness = false
